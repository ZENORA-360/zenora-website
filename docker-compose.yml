# =============================================================================
# ZENORA Web — Compose stack (local build + Harbor / NPM ready)
# =============================================================================
#
# Production (Nginx Proxy Manager — no host port bind):
#   PROXY_NETWORK=web-proxy  (external network shared with NPM)
#   docker compose pull web && docker compose up -d web
#   In NPM: forward zenora360.com → zenora-web:8080 (same Docker network)
#
# Local (publish a host port, create a local bridge if needed):
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build
#   → http://localhost:${WEB_HOST_PORT:-8080}
#
# Optional Watchtower:
#   docker compose --profile watchtower up -d
# =============================================================================

services:
  web:
    image: ${HARBOR_REGISTRY:-harbor.local}/${HARBOR_PROJECT:-zenora}/zenora-web:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: ${DOCKERFILE:-Dockerfile}
      args:
        BUILD_DATE: ${BUILD_DATE:-}
        VCS_REF: ${VCS_REF:-}
        VERSION: ${IMAGE_TAG:-latest}
    container_name: zenora-web
    restart: unless-stopped
    # Reachable by NPM on the shared Docker network (no host port published).
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/cache/nginx:mode=1777
      - /var/run:mode=1777
      - /tmp/nginx:mode=1777
      - /var/log/nginx:mode=1777
    labels:
      - "com.zenora.service=web"
      - "com.zenora.version=${IMAGE_TAG:-latest}"
      - "com.centurylinklabs.watchtower.enable=true"
    networks:
      - proxy

  watchtower:
    image: containrrr/watchtower:1.7.1
    container_name: zenora-watchtower
    restart: unless-stopped
    profiles: ["watchtower"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${DOCKER_CONFIG_JSON:-~/.docker/config.json}:/config.json:ro
    environment:
      - WATCHTOWER_LABEL_ENABLE=true
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=300
      - DOCKER_API_VERSION=1.44
    command: zenora-web
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.1"
    security_opt:
      - no-new-privileges:true
    networks:
      - proxy

networks:
  # Must already exist on the VPS (created by Nginx Proxy Manager / your stack).
  # Override name with PROXY_NETWORK if yours differs.
  proxy:
    name: ${PROXY_NETWORK:-web-proxy}
    external: true
