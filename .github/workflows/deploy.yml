name: Deploy

on:
  workflow_run:
    workflows: ["Release Image"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: production
        type: choice
        options:
          - production
      image_tag:
        description: "Immutable image tag to deploy (required). Example: sha-1a2b3c4"
        required: true
        type: string
      image_digest:
        description: "Optional digest (sha256:...). Preferred when known."
        required: false
        type: string

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE_NAME: zenora-web

jobs:
  resolve:
    name: Resolve release target
    if: >
      (github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      image_tag: ${{ steps.out.outputs.image_tag }}
      image_digest: ${{ steps.out.outputs.image_digest }}
      image_ref: ${{ steps.out.outputs.image_ref }}
      image_repo: ${{ steps.out.outputs.image_repo }}
      source_sha: ${{ steps.out.outputs.source_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download release metadata (workflow_run)
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: release-metadata
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve coordinates
        id: out
        env:
          HARBOR_REGISTRY: ${{ secrets.HARBOR_REGISTRY }}
          HARBOR_PROJECT: ${{ secrets.HARBOR_PROJECT }}
        shell: bash
        run: |
          set -euo pipefail
          # shellcheck source=.github/scripts/normalize-harbor.sh
          source .github/scripts/normalize-harbor.sh

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            IMAGE_TAG="${{ inputs.image_tag }}"
            IMAGE_DIGEST="${{ inputs.image_digest }}"
            SOURCE_SHA="${GITHUB_SHA}"

            if [ -z "$IMAGE_TAG" ] || [ "$IMAGE_TAG" = "latest" ]; then
              echo "Refusing to deploy 'latest' or empty tag. Pass an immutable sha-* tag."
              exit 1
            fi

            if [ -n "$IMAGE_DIGEST" ]; then
              IMAGE_REF="${REPO}@${IMAGE_DIGEST}"
            else
              IMAGE_REF="${REPO}:${IMAGE_TAG}"
              IMAGE_DIGEST=""
            fi
          else
            if [ ! -f release-metadata.json ]; then
              echo "release-metadata.json missing from Release Image artifacts"
              exit 1
            fi
            IMAGE_TAG="$(python3 -c 'import json; print(json.load(open("release-metadata.json"))["image_tag"])')"
            IMAGE_DIGEST="$(python3 -c 'import json; print(json.load(open("release-metadata.json"))["image_digest"])')"
            IMAGE_REF="$(python3 -c 'import json; print(json.load(open("release-metadata.json"))["image_ref"])')"
            SOURCE_SHA="$(python3 -c 'import json; print(json.load(open("release-metadata.json"))["git_sha"])')"
            REPO="$(python3 -c 'import json; print(json.load(open("release-metadata.json"))["image_repo"])')"
          fi

          {
            echo "image_tag=$IMAGE_TAG"
            echo "image_digest=$IMAGE_DIGEST"
            echo "image_ref=$IMAGE_REF"
            echo "image_repo=$REPO"
            echo "source_sha=$SOURCE_SHA"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## Deploy target"
            echo ""
            echo "- Tag: \`$IMAGE_TAG\`"
            echo "- Digest: \`${IMAGE_DIGEST:-n/a}\`"
            echo "- Ref: \`$IMAGE_REF\`"
          } >> "$GITHUB_STEP_SUMMARY"

  verify-signature:
    name: Verify Cosign signature
    needs:
      - resolve
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Verify signature before deploy
        run: |
          set -euo pipefail
          REF="${{ needs.resolve.outputs.image_ref }}"
          echo "Verifying $REF"

          cosign verify \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp "https://github.com/${{ github.repository }}/.github/workflows/release.yml@.*" \
            "$REF"

  deploy:
    name: Deploy to production
    needs:
      - resolve
      - verify-signature
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy compose assets to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT }}
          source: "docker-compose.yml,deploy/remote-deploy.sh"
          target: "${{ secrets.DEPLOY_APP_DIR }}"
          overwrite: true

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          HARBOR_REGISTRY: ${{ secrets.HARBOR_REGISTRY }}
          HARBOR_PROJECT: ${{ secrets.HARBOR_PROJECT }}
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
          DEPLOY_APP_DIR: ${{ secrets.DEPLOY_APP_DIR }}
          WEB_HOST_PORT: ${{ vars.WEB_HOST_PORT || '80' }}
          IMAGE_TAG: ${{ needs.resolve.outputs.image_tag }}
          IMAGE_DIGEST: ${{ needs.resolve.outputs.image_digest }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT }}
          envs: HARBOR_REGISTRY,HARBOR_PROJECT,HARBOR_USERNAME,HARBOR_PASSWORD,DEPLOY_APP_DIR,WEB_HOST_PORT,IMAGE_TAG,IMAGE_DIGEST,IMAGE_NAME
          script_stop: true
          script: |
            set -euo pipefail
            mkdir -p "$DEPLOY_APP_DIR"
            cd "$DEPLOY_APP_DIR"
            chmod +x deploy/remote-deploy.sh || chmod +x remote-deploy.sh || true
            if [ -f deploy/remote-deploy.sh ]; then
              bash deploy/remote-deploy.sh
            else
              bash remote-deploy.sh
            fi

      - name: Smoke test public endpoints
        shell: bash
        run: |
          set -euo pipefail
          URL="https://${{ vars.PUBLIC_BASE_HOST || 'zenora360.com' }}"
          curl -fsS "${URL}/health"
          curl -fsS -o /dev/null -w "%{http_code}\n" "${URL}/" | grep -E '200|301|302'

      - name: Deployment summary
        run: |
          {
            echo "## Production deploy"
            echo ""
            echo "- Tag: \`${{ needs.resolve.outputs.image_tag }}\`"
            echo "- Digest: \`${{ needs.resolve.outputs.image_digest }}\`"
            echo "- Signature verified before SSH"
            echo "- Smoke checks: /health + /"
          } >> "$GITHUB_STEP_SUMMARY"

  notify:
    name: Notify deploy
    needs:
      - deploy
    if: always()
    uses: ./.github/workflows/reusable-notify.yml
    with:
      status: ${{ needs.deploy.result }}
      title: "ZENORA production deploy"
      environment: production
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
