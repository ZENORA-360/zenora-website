name: Deploy

on:
  workflow_run:
    workflows: ["Release Image"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: production
        type: choice
        options:
          - production
      image_tag:
        description: "Immutable image tag to deploy (required). Example: sha-1a2b3c4"
        required: true
        type: string
      image_digest:
        description: "Optional digest (sha256:...). Preferred when known."
        required: false
        type: string

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE_NAME: zenora-web

jobs:
  resolve:
    name: Resolve release target
    if: >
      (github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      image_tag: ${{ steps.out.outputs.image_tag }}
      image_digest: ${{ steps.out.outputs.image_digest }}
      source_sha: ${{ steps.out.outputs.source_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download release metadata (workflow_run)
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: release-metadata
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve coordinates
        id: out
        env:
          HARBOR_REGISTRY: ${{ secrets.HARBOR_REGISTRY }}
          HARBOR_PROJECT: ${{ secrets.HARBOR_PROJECT }}
        shell: bash
        run: |
          set -euo pipefail
          # shellcheck source=.github/scripts/normalize-harbor.sh
          source .github/scripts/normalize-harbor.sh

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            IMAGE_TAG="${{ inputs.image_tag }}"
            IMAGE_DIGEST="${{ inputs.image_digest }}"
            SOURCE_SHA="${GITHUB_SHA}"

            if [ -z "$IMAGE_TAG" ] || [ "$IMAGE_TAG" = "latest" ]; then
              echo "Refusing to deploy 'latest' or empty tag. Pass an immutable sha-* tag."
              exit 1
            fi

            if [ -n "$IMAGE_DIGEST" ]; then
              IMAGE_REF="${REPO}@${IMAGE_DIGEST}"
            else
              IMAGE_REF="${REPO}:${IMAGE_TAG}"
              IMAGE_DIGEST=""
            fi
          else
            if [ ! -f release-metadata.json ]; then
              echo "release-metadata.json missing from Release Image artifacts"
              exit 1
            fi
            IMAGE_TAG="$(python3 -c 'import json; print(json.load(open("release-metadata.json"))["image_tag"])')"
            IMAGE_DIGEST="$(python3 -c 'import json; print(json.load(open("release-metadata.json"))["image_digest"])')"
            IMAGE_REF="$(python3 -c 'import json; print(json.load(open("release-metadata.json"))["image_ref"])')"
            SOURCE_SHA="$(python3 -c 'import json; print(json.load(open("release-metadata.json"))["git_sha"])')"
            REPO="$(python3 -c 'import json; print(json.load(open("release-metadata.json"))["image_repo"])')"
          fi

          if [ -z "${IMAGE_TAG:-}" ]; then
            echo "Resolved image_tag is empty."
            exit 1
          fi

          # Do not export image_ref / image_repo: they contain HARBOR_REGISTRY
          # (a secret), so GitHub blanks those outputs in downstream jobs.
          {
            echo "image_tag=$IMAGE_TAG"
            echo "image_digest=$IMAGE_DIGEST"
            echo "source_sha=$SOURCE_SHA"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## Deploy target"
            echo ""
            echo "- Tag: \`$IMAGE_TAG\`"
            echo "- Digest: \`${IMAGE_DIGEST:-n/a}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  verify-signature:
    name: Verify Cosign signature
    needs:
      - resolve
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Verify signature before deploy
        env:
          HARBOR_REGISTRY: ${{ secrets.HARBOR_REGISTRY }}
          HARBOR_PROJECT: ${{ secrets.HARBOR_PROJECT }}
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
          IMAGE_TAG: ${{ needs.resolve.outputs.image_tag }}
          IMAGE_DIGEST: ${{ needs.resolve.outputs.image_digest }}
        run: |
          set -euo pipefail
          source .github/scripts/normalize-harbor.sh
          if [ -z "${IMAGE_TAG:-}" ]; then
            echo "image_tag is empty — resolve job did not produce a deployable tag."
            exit 1
          fi
          if [ -n "${IMAGE_DIGEST:-}" ]; then
            REF="${REPO}@${IMAGE_DIGEST}"
          else
            REF="${REPO}:${IMAGE_TAG}"
          fi
          echo "Verifying tag ${IMAGE_TAG}"
          echo "$HARBOR_PASSWORD" | docker login "$HARBOR_REGISTRY" -u "$HARBOR_USERNAME" --password-stdin
          cosign verify \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp "https://github.com/${{ github.repository }}/.github/workflows/release.yml@.*" \
            "$REF"

  deploy:
    name: Deploy to production
    needs:
      - resolve
      - verify-signature
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preflight SSH target
        env:
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
          DEPLOY_APP_DIR: ${{ secrets.DEPLOY_APP_DIR }}
        run: |
          set -euo pipefail
          host="$(printf '%s' "$DEPLOY_SSH_HOST" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          user="$(printf '%s' "$DEPLOY_SSH_USER" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          port="$(printf '%s' "$DEPLOY_SSH_PORT" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          dir="$(printf '%s' "$DEPLOY_APP_DIR" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          key="$(printf '%s' "$DEPLOY_SSH_KEY" | tr -d '\r')"

          echo "host_set=$([ -n "$host" ] && echo yes || echo NO)"
          echo "user_set=$([ -n "$user" ] && echo yes || echo NO)"
          echo "port_set=$([ -n "$port" ] && echo yes || echo NO)"
          echo "key_set=$([ -n "$key" ] && echo yes || echo NO)"
          echo "app_dir_set=$([ -n "$dir" ] && echo yes || echo NO)"
          echo "host_len=${#host} user_len=${#user} port_len=${#port} key_len=${#key}"
          echo "host_is_ipv4=$([[ "$host" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]] && echo yes || echo no)"
          echo "port_is_numeric=$([[ "$port" =~ ^[0-9]+$ ]] && echo yes || echo no)"
          echo "host_matches_51_255_205_10=$([ "$host" = "51.255.205.10" ] && echo yes || echo no)"
          echo "port_matches_1026=$([ "$port" = "1026" ] && echo yes || echo no)"
          echo "key_has_begin=$(printf '%s' "$key" | grep -q 'BEGIN .*PRIVATE KEY' && echo yes || echo no)"
          echo "key_has_end=$(printf '%s' "$key" | grep -q 'END .*PRIVATE KEY' && echo yes || echo no)"

          if [ -z "$host" ] || [ -z "$user" ] || [ -z "$port" ] || [ -z "$key" ] || [ -z "$dir" ]; then
            echo "A deploy SSH secret is empty in the *production* environment."
            echo "This job uses environment: production — repo secrets are not enough if env secrets exist empty, or if the env is missing the keys."
            exit 1
          fi
          if ! [[ "$port" =~ ^[0-9]+$ ]]; then
            echo "DEPLOY_SSH_PORT is not a number. appleboy would then fall back to 22."
            exit 1
          fi

          echo "TCP probe ${host}:${port} from GitHub runner (5s)..."
          if timeout 5 bash -c "echo >/dev/tcp/${host}/${port}"; then
            echo "TCP_OK: runner can reach host:port. If SCP still times out, look at UFW limit / too many connections."
          else
            echo "TCP_FAIL: GitHub cannot open TCP to this host:port."
            echo "USER/KEY are not involved yet. Allow 1026/tcp from 0.0.0.0/0 (or GitHub), not only your laptop IP."
            exit 1
          fi

      - name: Copy compose assets to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT }}
          timeout: 30s
          source: "docker-compose.yml,deploy/remote-deploy.sh"
          target: "${{ secrets.DEPLOY_APP_DIR }}"
          overwrite: true

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          HARBOR_REGISTRY: ${{ secrets.HARBOR_REGISTRY }}
          HARBOR_PROJECT: ${{ secrets.HARBOR_PROJECT }}
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
          DEPLOY_APP_DIR: ${{ secrets.DEPLOY_APP_DIR }}
          WEB_HOST_PORT: ${{ vars.WEB_HOST_PORT || '80' }}
          IMAGE_TAG: ${{ needs.resolve.outputs.image_tag }}
          IMAGE_DIGEST: ${{ needs.resolve.outputs.image_digest }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT }}
          envs: HARBOR_REGISTRY,HARBOR_PROJECT,HARBOR_USERNAME,HARBOR_PASSWORD,DEPLOY_APP_DIR,WEB_HOST_PORT,IMAGE_TAG,IMAGE_DIGEST,IMAGE_NAME
          script_stop: true
          script: |
            set -euo pipefail
            mkdir -p "$DEPLOY_APP_DIR"
            cd "$DEPLOY_APP_DIR"
            chmod +x deploy/remote-deploy.sh || chmod +x remote-deploy.sh || true
            if [ -f deploy/remote-deploy.sh ]; then
              bash deploy/remote-deploy.sh
            else
              bash remote-deploy.sh
            fi

      - name: Smoke test public endpoints
        shell: bash
        run: |
          set -euo pipefail
          URL="https://${{ vars.PUBLIC_BASE_HOST || 'zenora360.com' }}"
          curl -fsS "${URL}/health"
          curl -fsS -o /dev/null -w "%{http_code}\n" "${URL}/" | grep -E '200|301|302'

      - name: Deployment summary
        run: |
          {
            echo "## Production deploy"
            echo ""
            echo "- Tag: \`${{ needs.resolve.outputs.image_tag }}\`"
            echo "- Digest: \`${{ needs.resolve.outputs.image_digest }}\`"
            echo "- Signature verified before SSH"
            echo "- Smoke checks: /health + /"
          } >> "$GITHUB_STEP_SUMMARY"

  notify:
    name: Notify deploy
    needs:
      - deploy
    if: always()
    uses: ./.github/workflows/reusable-notify.yml
    with:
      status: ${{ needs.deploy.result }}
      title: "ZENORA production deploy"
      environment: production
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
