# Reusable quality gate — call from CI / Release / other products.
name: Reusable quality

on:
  workflow_call:
    inputs:
      node_version:
        description: Node.js version
        required: false
        type: string
        default: "22"
      upload_dist:
        description: Upload dist/ as artifact
        required: false
        type: boolean
        default: false
      run_coverage:
        description: Collect coverage during tests
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ inputs.node_version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: |
          if [ "${{ inputs.run_coverage }}" = "true" ]; then
            npm run test -- --coverage
          else
            npm run test
          fi

      - name: Build
        run: npm run build

      - name: Quality summary
        if: always()
        run: |
          {
            echo "## Quality gate"
            echo ""
            if [ -f coverage/coverage-summary.json ]; then
              python3 -c '
          import json
          from pathlib import Path
          total = json.loads(Path("coverage/coverage-summary.json").read_text()).get("total", {})
          def pct(k):
              v = total.get(k, {}).get("pct")
              return f"{v}%" if v is not None else "n/a"
          print("### Coverage")
          print("")
          print(f"| Metric | Value |")
          print(f"| --- | --- |")
          print(f"| Statements | **{pct(\"statements\")}** |")
          print(f"| Branches | **{pct(\"branches\")}** |")
          print(f"| Functions | **{pct(\"functions\")}** |")
          print(f"| Lines | **{pct(\"lines\")}** |")
          '
            else
              echo "_No coverage/coverage-summary.json (coverage disabled or empty suite)._"
            fi
            echo ""
            echo "Artifact \`coverage-report\` retained when coverage ran."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage
        if: always() && inputs.run_coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-report
          path: coverage
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload build output
        if: inputs.upload_dist
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-dist
          path: dist
          if-no-files-found: error
          retention-days: 7
