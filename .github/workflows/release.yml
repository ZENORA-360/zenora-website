name: Release Image

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write
  packages: write
  security-events: write
  actions: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  IMAGE_NAME: zenora-web

jobs:
  quality:
    name: Pre-release quality
    uses: ./.github/workflows/reusable-quality.yml
    with:
      node_version: "22"
      upload_dist: false
      run_coverage: false

  build-scan-sign-publish:
    name: Build → scan → sign → publish
    needs:
      - quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require Harbor secrets
        env:
          HARBOR_REGISTRY: ${{ secrets.HARBOR_REGISTRY }}
          HARBOR_PROJECT: ${{ secrets.HARBOR_PROJECT }}
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          missing=0
          for v in HARBOR_REGISTRY HARBOR_PROJECT HARBOR_USERNAME HARBOR_PASSWORD; do
            if [ -z "${!v}" ]; then
              echo "Missing secret: $v"
              missing=1
            fi
          done
          exit $missing

      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install crane
        uses: imjasonh/setup-crane@v0.4

      - name: Resolve image coordinates
        shell: bash
        run: |
          REPO="${{ secrets.HARBOR_REGISTRY }}/${{ secrets.HARBOR_PROJECT }}/${{ env.IMAGE_NAME }}"
          IMAGE_TAG="sha-${GITHUB_SHA::7}"
          LOCAL_TAG="zenora-web:ci-candidate"
          {
            echo "REPO=$REPO"
            echo "IMAGE_TAG=$IMAGE_TAG"
            echo "LOCAL_TAG=$LOCAL_TAG"
          } >> "$GITHUB_ENV"

      - name: Docker metadata labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.HARBOR_REGISTRY }}/${{ secrets.HARBOR_PROJECT }}/${{ env.IMAGE_NAME }}
          labels: |
            org.opencontainers.image.title=ZENORA Web
            org.opencontainers.image.vendor=ZENORA
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      # 1) Build locally only — never push an unscanned image
      - name: Build candidate image (local load)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          push: false
          tags: zenora-web:ci-candidate
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp || github.run_started_at }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ env.IMAGE_TAG }}

      # 2) Security gate on the candidate — fail closed
      - name: Trivy image scan (gate HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: zenora-web:ci-candidate
          format: sarif
          output: trivy-image.sarif
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          scanners: vuln,secret,misconfig

      - name: Upload Trivy image SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

      # 3) Only then tag + push to Harbor
      - name: Tag release aliases
        run: |
          docker tag "${LOCAL_TAG}" "${REPO}:${IMAGE_TAG}"
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            docker tag "${LOCAL_TAG}" "${REPO}:latest"
          fi
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            docker tag "${LOCAL_TAG}" "${REPO}:${{ github.ref_name }}"
          fi

      - name: Push image tags
        id: push
        shell: bash
        run: |
          docker push "${REPO}:${IMAGE_TAG}"
          DIGEST="$(crane digest "${REPO}:${IMAGE_TAG}")"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "DIGEST=$DIGEST" >> "$GITHUB_ENV"
          echo "Resolved digest: $DIGEST"

          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            docker push "${REPO}:latest"
          fi
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            docker push "${REPO}:${{ github.ref_name }}"
          fi

      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REPO }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image (keyless OIDC)
        run: cosign sign --yes "${REPO}@${DIGEST}"

      - name: Verify image signature
        run: |
          cosign verify \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp "https://github.com/${{ github.repository }}/.github/workflows/release.yml@.*" \
            "${REPO}@${DIGEST}"

      - name: Attach SBOM to image
        run: cosign attach sbom --sbom sbom.spdx.json "${REPO}@${DIGEST}"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ env.REPO }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Write release metadata artifact
        run: |
          python3 - <<'PY'
          import json, os, datetime
          meta = {
            "image_repo": os.environ["REPO"],
            "image_tag": os.environ["IMAGE_TAG"],
            "image_digest": os.environ["DIGEST"],
            "image_ref": f'{os.environ["REPO"]}@{os.environ["DIGEST"]}',
            "git_sha": os.environ["GITHUB_SHA"],
            "git_ref": os.environ["GITHUB_REF"],
            "created_at": datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ"),
          }
          with open("release-metadata.json", "w", encoding="utf-8") as f:
              json.dump(meta, f, indent=2)
          print(json.dumps(meta, indent=2))
          PY

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-metadata
          path: |
            release-metadata.json
            sbom.spdx.json
            trivy-image.sarif
          retention-days: 30

      - name: Job summary
        run: |
          {
            echo "## Release published"
            echo ""
            echo "- Repo: \`${REPO}\`"
            echo "- Tag: \`${IMAGE_TAG}\`"
            echo "- Digest: \`${DIGEST}\`"
            echo "- Flow: build → Trivy gate → push → Cosign → SBOM → provenance"
          } >> "$GITHUB_STEP_SUMMARY"

  notify:
    name: Notify release
    needs:
      - build-scan-sign-publish
    if: always()
    uses: ./.github/workflows/reusable-notify.yml
    with:
      status: ${{ needs.build-scan-sign-publish.result }}
      title: "ZENORA image release"
      environment: registry
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
